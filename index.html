:root{
  --paper:#f2efe3;--card:#faf7ee;
  --ink:#1c1a15;--ink2:#3b372e;--muted:#8b8577;--line:#ddd5c4;
  --accent:#a8452f;--tint:#efdcd4;
  --serif:"SerifCN","Songti SC","Songti TC","STSong",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","Kaiti TC","Noto Serif CJK SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --num:Georgia,"Times New Roman",serif;
}
/* 八个结果各一个低饱和强调色（同明度、同彩度档，换色不换版） */
.c1{--accent:#a8452f;--tint:#eed9d2}
.c2{--accent:#47617d;--tint:#dae2ec}
.c3{--accent:#5c7350;--tint:#dde5d8}
.c4{--accent:#7a5c74;--tint:#e7dce6}
.c5{--accent:#8c3f33;--tint:#ecd6d2}
.c6{--accent:#95702f;--tint:#ece1c9}
.c7{--accent:#4f6b66;--tint:#d9e5e2}
.c8{--accent:#b0552f;--tint:#f0dccf}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);line-height:1.95;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{max-width:600px;margin:0 auto;padding:0 clamp(20px,5.6vw,28px) calc(56px + env(safe-area-inset-bottom));min-height:100vh}
.hidden{display:none!important}
::selection{background:var(--ink);color:var(--paper)}

/* 构件：描边胶囊标签 */
.cap{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:5px 13px;
  font-size:13px;letter-spacing:.1em;line-height:1.5;color:var(--ink);white-space:nowrap;padding:6px 15px}
.cap-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 0}
.cap-r{font-size:14.5px;letter-spacing:.14em;color:var(--muted)}
/* 构件：两端带圆点的刻度线 */
.tick{position:relative;height:1px;background:var(--ink);margin:0}
.tick::before,.tick::after{content:"";position:absolute;top:-2.5px;width:6px;height:6px;border-radius:50%}
.tick::before{left:0;background:var(--ink)}
.tick::after{right:0;background:var(--accent)}
/* 构件：手绘箭头 */
.grow{flex:1 1 auto;min-height:24px}
.arrow{display:block;align-self:flex-end;margin:0 4px 6px 0;color:var(--accent);opacity:.9}
/* 构件：压在字下的高亮条 */
.hl{box-shadow:inset 0 -.34em 0 var(--tint);padding-bottom:.02em}

/* 封面 */
#intro{padding-top:calc(env(safe-area-inset-top) + 26px);display:flex;flex-direction:column;
  min-height:calc(100svh - 56px - env(safe-area-inset-bottom))}
#intro .cap-row{margin-bottom:0}
#intro h1{font-family:var(--serif);font-weight:900;margin:0;color:var(--ink)}
#intro h1 .l1{display:block;font-weight:600;font-size:clamp(26px,7.2vw,32px);letter-spacing:.03em;line-height:1.6}
#intro h1 .l2{display:block;font-size:clamp(37px,10.4vw,46px);letter-spacing:.02em;line-height:1.35;
  margin-left:clamp(6px,3.4vw,18px);margin-top:2px}
#intro .hero{margin-top:clamp(56px,15vw,86px)}
#intro .lede{font-size:14px;line-height:1.8;color:var(--muted);
  letter-spacing:.05em;margin:20px 0 0}
#intro .lede.hide{display:none}
#intro .note{font-size:17px;line-height:1.95;color:var(--ink2);margin:0}
#intro .mid{margin:26px 0 0}
#intro .mid .tick{margin-bottom:24px}
#intro .note + .arrow{margin:34px 0 0 auto}
#intro .btn{margin-top:22px}
.btn{display:block;width:100%;letter-spacing:.18em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-family:inherit;font-size:15.5px;letter-spacing:.22em;text-indent:.22em;padding:17px 20px;
  border-radius:999px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);letter-spacing:.14em}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.foot{font-size:12px;line-height:2;color:var(--muted);margin:22px 0 0}

/* 答题 */
#quiz{padding-top:0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(env(safe-area-inset-top) + 14px) 0 0}
.segs{display:flex;gap:5px}
.seg{flex:1 1 0;height:3px;border-radius:2px;background:var(--line)}
.seg.on{background:var(--accent)}
.bar .cnt{font-family:var(--num);font-size:11px;letter-spacing:.16em;color:var(--muted);
  text-align:right;padding:9px 0 4px}
.q-num{margin:30px 0 0}
.q-title{font-family:var(--serif);font-weight:900;font-size:clamp(23px,6.4vw,28px);line-height:1.72;
  letter-spacing:.02em;margin:18px 0 26px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:2px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;
  border:1px solid #cfc6b2;border-radius:16px;padding:11px 15px 11px 11px;font-family:inherit;

.opt .n{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid #b5ab95;background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:13px;letter-spacing:.02em;color:var(--muted)}
.opt .t{flex:1 1 auto}

.opt:active{transform:scale(.994)}

.opt.on .n{background:var(--accent);border-color:var(--accent);color:#fff}
.q-foot{display:flex;align-items:center;gap:14px;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.q-foot .hint{font-size:12.5px;letter-spacing:.06em;color:var(--muted);margin-left:auto}
.q-foot .arrow{color:var(--accent);flex:0 0 auto;margin-right:-2px}
.back{margin:24px 0 0;background:none;border:0;padding:8px 0;font-family:inherit;font-size:12.5px;
  letter-spacing:.1em;color:var(--muted);cursor:pointer}

#result{padding-top:calc(env(safe-area-inset-top) + 26px)}
.res-top{display:flex;align-items:center;justify-content:flex-end;margin:0 0 30px}

  letter-spacing:.02em;color:var(--accent);margin:0 0 8px}
.res-oneliner{font-size:14px;color:var(--muted);margin:0 0 30px;letter-spacing:.01em;line-height:1.85}

.tie{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.8}
.sec{margin:0}

  font-family:var(--serif);font-size:clamp(18px,4.8vw,19.5px);font-weight:600;line-height:1.6;color:var(--ink)}
.sec h3::before{content:"";position:absolute;left:0;top:.72em;width:22px;height:1px;background:var(--accent);opacity:.75}
.sec h3::after{content:"";position:absolute;left:24px;top:calc(.72em - 2.5px);width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sec h3 i{font-style:normal;font-family:var(--num);font-size:12px;letter-spacing:.08em;color:var(--muted);margin-right:9px}
.sec p{margin:0 0 15px;font-size:15px;line-height:2.0;color:var(--ink2)}
.sec ul{margin:0;padding:0;list-style:none}
.sec.s2 ul{background:var(--card);border:1px solid #e2dac8;border-radius:16px;padding:18px 16px}
.sec.s2 li{display:grid;grid-template-columns:46px 1fr;align-items:baseline;
  margin:0 0 13px;font-size:14.5px;line-height:1.95;color:var(--ink2)}
.sec.s2 li:last-child{margin-bottom:0}
.sec.s2 .st{font-family:var(--serif);font-size:12px;color:var(--accent);
  letter-spacing:.04em;line-height:1.95;white-space:nowrap}
.sec.s3 p{color:#4a453a;padding-right:6%}
.sec.s4 p{font-size:16px;line-height:1.95;color:var(--ink)}
.sec.s4 .sec-in{padding-left:14px;border-left:2px solid var(--accent)}
.actions{margin:44px 0 0;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);font-size:13px;letter-spacing:.06em;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 取货码遮罩：只挡视线，不是加密。去掉这层就删掉本段 + #gate + 末尾那段脚本 */
body.locked{overflow:hidden}
#gate{position:fixed;top:0;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;z-index:200;
  background:var(--paper);display:flex;flex-direction:column;justify-content:center;

#gate .g-t{font-family:var(--serif);font-size:31px;line-height:1.45;letter-spacing:.03em;margin:0 0 14px;color:var(--ink)}
#gate .g-s{font-size:14.5px;color:var(--ink2);line-height:1.95;margin:0}
#gate .g-tick{margin:28px 0 26px}
#gate .g-in{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:2px;
  padding:16px 18px;font-size:20px;letter-spacing:.42em;text-align:center;text-indent:.42em;font-family:var(--num);
  color:var(--ink);outline:none;-webkit-appearance:none;transition:border-color .15s}
#gate .g-in:focus{border-color:var(--ink)}

@keyframes gsh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#gate .g-err{font-size:13px;color:var(--accent);letter-spacing:.06em;line-height:1.6;min-height:21px;margin:10px 0 0}
#gate .btn{margin-top:8px}
#gate .g-foot{position:absolute;left:clamp(24px,6.4vw,30px);right:clamp(24px,6.4vw,30px);
  bottom:calc(26px + env(safe-area-inset-bottom));margin:0;
  font-size:12px;color:var(--muted);letter-spacing:.04em;line-height:1.9;text-align:center}

const S = {i:0, answers:new Array(DATA.questions.length).fill(null), order:[]};

  const I=DATA.intro;
  if(!I)return;
  const _t2=I.t2, _n=_t2.length;
  $('i-h1').innerHTML='<span class="l1">'+I.t1+'</span><span class="l2">'
    +(_n>2?_t2.slice(0,_n-2)+'<span class="hl">'+_t2.slice(-2)+'</span>':_t2)+'</span>';
  $('i-sub').textContent=I.sub;

paintIntro();
const TYPES = [...new Set(DATA.questions.flatMap(q => q.options.map(o => o.type)))];

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function start(){
  S.i=0;S.answers.fill(null);S.order=DATA.questions.map(q=>shuffle(q.options.map((o,k)=>k)));
  $('intro').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');
  render();
}

function render(){
  const q=DATA.questions[S.i];
  $('cnt').textContent=String(S.i+1).padStart(2,'0')+' / '+DATA.questions.length;
  const segs=$('segs');
  if(segs.children.length!==DATA.questions.length){
    segs.innerHTML='';
    DATA.questions.forEach(()=>{const d=document.createElement('div');d.className='seg';segs.appendChild(d);});
  }
  [...segs.children].forEach((d,k)=>d.classList.toggle('on',k<=S.i));
  $('venue').textContent='第 '+(S.i+1)+' 题';
  const HL={1:'不认识的人',2:'三天',3:'好多次',4:'200块',5:'没人叫你',6:'没提还',
            7:'阴阳你',8:'没有反应',9:'把你鸽了',10:'最边上',11:'总有理由',12:'差了一个人'};
  const _w=HL[S.i+1], _src=DATA.questions[S.i].venue;
  if(_w&&_src.indexOf(_w)>=0){
    const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    $('qtitle').innerHTML=esc(_src).replace(_w,'<span class="hl">'+_w+'</span>');
  }else{
    $('qtitle').textContent=_src;
  }
  const box=$('opts');box.innerHTML='';
  S.order[S.i].forEach((k,pos)=>{
    const o=q.options[k];
    const b=document.createElement('button');
    b.className='opt';b.type='button';
    const n=document.createElement('span');n.className='n';n.textContent='ABCD'[pos]||String(pos+1);
    const t=document.createElement('span');t.className='t';t.textContent=o.text;
    b.appendChild(n);b.appendChild(t);
    b.onclick=()=>choose(S.i,k,b);
    box.appendChild(b);
  });
  $('back').style.visibility=S.i===0?'hidden':'visible';
  window.scrollTo(0,0);
}

function choose(i,k,el){
  S.answers[i]=k;
  if(el)el.classList.add('on');
  setTimeout(()=>{
    if(i+1<DATA.questions.length){S.i++;render();}
    else finish();
  },150);
}

function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function finish(){
  const picked=S.answers.map((k,i)=>Object.assign({venue:DATA.questions[i].venue},DATA.questions[i].options[k]));
  const counts={};picked.forEach(p=>counts[p.type]=(counts[p.type]||0)+1);
  const max=Math.max(...Object.values(counts));
  const tied=Object.keys(counts).filter(t=>counts[t]===max);
  const key=picked.map(p=>p.type).join('|');
  const seq=picked.map(p=>p.type);
  const best=tied.length===1?tied[0]:tied[hash(seq.join('|'))%tied.length];
  window.__tie=tied.length>1;
  showResult(best,picked,key);
}

  document.body.className='c'+idx;
  const nm=r.name;
  $('rname').innerHTML=nm.length>2 ? nm.slice(0,-2)+'<span class="hl">'+nm.slice(-2)+'</span>' : nm;
  $('rident').textContent=r.identity;
  $('roneliner').textContent=r.oneliner;
  $('rheadline').textContent=r.headline;
  const host=$('rsecs');host.innerHTML='';

  const push=(title,node,n)=>{const d=document.createElement('div');d.className='sec s'+(n+1);
    if(title){const h=document.createElement('h3');h.textContent=title;d.appendChild(h);}
    d.appendChild(node);host.appendChild(d);};

  const STAGE=['一','二','三','四','五','六'];
  function secNode(s){
    const wrap=document.createElement('div');
    const staged=!!s.title&&s.title.indexOf('阶段')>=0;
    if(s.kind==='ul'||s.kind==='ol'){
      const list=document.createElement(s.kind);
      s.items.forEach((t,n)=>{
        const li=document.createElement('li');
        if(staged&&STAGE[n]){const st=document.createElement('span');st.className='st';st.textContent='阶段'+STAGE[n];li.appendChild(st);}
        li.appendChild(document.createTextNode(t));list.appendChild(li);});
      wrap.appendChild(list);
    }else{
      s.items.forEach(t=>{const p=document.createElement('p');p.textContent=t;wrap.appendChild(p);});
    }
    return wrap;
  }

  r.sections.forEach((s,i)=>{
    push(s.title,secNode(s),i);
  });

  $('rfoot').innerHTML='';
  DATA.footer.forEach(t=>{const p=document.createElement('div');p.textContent=t;$('rfoot').appendChild(p);});
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
  window.scrollTo(0,0);
  window.__lastResult={type,picked,key};
}

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600);}

/* 预览：地址后加 ?preview=1..8 直接看某一页结果 */
(function(){
  if(/quiz/.test(location.search)){ start(); return; }
  const m=(location.search.match(/preview=(\d)/)||[])[1];
  if(!m) return;
  const r=DATA.results[parseInt(m,10)-1]; if(!r) return;
  const picked=DATA.questions.map(q=>{const o=q.options.find(o=>o.type===r.name);return Object.assign({venue:q.venue},o);});
  $('intro').classList.add('hidden');
  showResult(r.name,picked,picked.map(p=>p.type).join('|'));
})();

$('start').onclick=start;
$('again').onclick=start;
$('back').onclick=()=>{if(S.i>0){S.i--;render();}};
$('copy').onclick=async()=>{
  const r=DATA.results.find(x=>x.name===window.__lastResult.type);
  const txt=[r.identity,r.oneliner,r.headline,'——你会因为什么和好朋友走散'].join('\n');
  try{await navigator.clipboard.writeText(txt);toast('已复制');}catch(e){toast('复制失败，长按选中文字');}
};

/* 取货码：视觉遮挡，不是加密。改码就改下面这一行 */
const ACCESS_CODE="7391";
(function(){
  const gate=$('gate'),inp=$('g-in'),err=$('g-err'),go=$('g-go'),KEY='cc_gate_ok';
  function leave(){gate.classList.add('off');document.body.classList.remove('locked');}
  let saved=null;
  try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved==='1'){leave();return;}
  document.body.classList.add('locked');
  setTimeout(()=>{try{inp.focus();}catch(e){}},80);
  function check(){
    if(inp.value.replace(/\D/g,'')===ACCESS_CODE){
      try{localStorage.setItem(KEY,'1');}catch(e){}
      leave();return;
    }
    err.textContent='暗号不对，再看看你收到的信息';
    inp.classList.add('err');
    setTimeout(()=>inp.classList.remove('err'),360);
    inp.value='';
    try{inp.focus();}catch(e){}
  }
  go.onclick=check;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'');err.textContent='';});
})();
</script>
